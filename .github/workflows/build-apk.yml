name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME).
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the latest news as the offline starter copy
        run: |
          cp data/news.json app/src/main/assets/news.json
          cp data/trials.json app/src/main/assets/trials.json

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK and write version.json
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/OncologyPulse.apk
          NOTES=$(git log -1 --pretty=%s | head -c 140)
          python3 -c "import json,sys; json.dump({'versionCode': int(sys.argv[1]), 'versionName': '1.0.'+sys.argv[1], 'notes': sys.argv[2]}, open('out/version.json','w'))" "${{ github.run_number }}" "$NOTES"
          cat out/version.json
          ls -la out

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Oncology Pulse (latest build)
          body: |
            Download **OncologyPulse.apk** below on your Android phone and open it to install.
            Build ${{ github.run_number }} from commit ${{ github.sha }}.
          files: |
            out/OncologyPulse.apk
            out/version.json
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: OncologyPulse-apk
          path: out/OncologyPulse.apk
